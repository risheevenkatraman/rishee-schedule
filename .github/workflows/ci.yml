name: Check R&R Calendar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build:amplify
        env:
          APP_REGION: us-east-2
          APP_TABLE_NAME: ci-table
          APP_BUCKET_NAME: ci-bucket
          APP_SECRET_ARN: arn:aws:secretsmanager:us-east-2:000000000000:secret:ci-placeholder
          APP_ORIGIN: https://ci.example.com
